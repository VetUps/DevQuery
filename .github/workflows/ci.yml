name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backend_tag:
        description: Backend image tag to deploy
        required: false
        type: string
      frontend_tag:
        description: Frontend image tag to deploy
        required: false
        type: string

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stackoverflow_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_NAME: stackoverflow_ci
      DATABASE_USER: root
      DATABASE_USER_PASSWORD: root
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Run backend tests
        run: python manage.py test

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

  publish-images:
    name: DockerHub Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image for pull request
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          tags: devquery-backend:pr

      - name: Build frontend image for pull request
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          tags: devquery-frontend:pr
          build-args: |
            VITE_API_BASE_URL=http://127.0.0.1:8000

      - name: Validate DockerHub publish configuration
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          test -n "$VITE_API_BASE_URL"

      - name: Log in to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract backend image metadata
        id: backend-meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/devquery-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Extract frontend image metadata
        id: frontend-meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/devquery-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push backend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}

      - name: Build and push frontend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}

  deploy-vps:
    name: VPS Deploy
    runs-on: ubuntu-latest
    needs: publish-images
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: production
    concurrency:
      group: production-vps
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      PUBLIC_FRONTEND_URL: ${{ vars.PUBLIC_FRONTEND_URL }}
      PUBLIC_BACKEND_URL: ${{ vars.PUBLIC_BACKEND_URL }}
    steps:
      - name: Validate VPS deploy configuration
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PORT"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_SSH_KNOWN_HOSTS"
          test -n "$VPS_DEPLOY_PATH"
          test -n "$PUBLIC_FRONTEND_URL"
          test -n "$PUBLIC_BACKEND_URL"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select deployment images
        id: deploy-images
        shell: bash
        env:
          BACKEND_TAG_INPUT: ${{ github.event.inputs.backend_tag }}
          FRONTEND_TAG_INPUT: ${{ github.event.inputs.frontend_tag }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          DEFAULT_TAG="sha-${SHORT_SHA}"
          BACKEND_TAG="${BACKEND_TAG_INPUT:-$DEFAULT_TAG}"
          FRONTEND_TAG="${FRONTEND_TAG_INPUT:-$DEFAULT_TAG}"
          echo "backend_image=${DOCKERHUB_USERNAME}/devquery-backend:${BACKEND_TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${DOCKERHUB_USERNAME}/devquery-frontend:${FRONTEND_TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync VPS deploy contract
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p \"$VPS_DEPLOY_PATH\""
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" ci/docker-compose-vps.yml "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/compose.yaml"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" ci/deploy-vps.sh "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/.deploy-vps.sh"
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "chmod +x \"$VPS_DEPLOY_PATH/.deploy-vps.sh\""

      - name: Deploy Docker Compose stack
        shell: bash
        env:
          BACKEND_IMAGE: ${{ steps.deploy-images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.deploy-images.outputs.frontend_image }}
          PUBLIC_FRONTEND_URL: ${{ env.PUBLIC_FRONTEND_URL }}
          PUBLIC_BACKEND_URL: ${{ env.PUBLIC_BACKEND_URL }}
          COMPOSE_FILE: compose.yaml
          COMPOSE_PROJECT_NAME: devquery
        run: |
          set -euo pipefail
          : "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
          : "${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}"
          : "${PUBLIC_FRONTEND_URL:?PUBLIC_FRONTEND_URL is required}"
          : "${PUBLIC_BACKEND_URL:?PUBLIC_BACKEND_URL is required}"
          : "${COMPOSE_FILE:?COMPOSE_FILE is required}"
          : "${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}"
          backend_image=$(printf '%q' "$BACKEND_IMAGE")
          frontend_image=$(printf '%q' "$FRONTEND_IMAGE")
          public_frontend_url=$(printf '%q' "$PUBLIC_FRONTEND_URL")
          public_backend_url=$(printf '%q' "$PUBLIC_BACKEND_URL")
          compose_file=$(printf '%q' "$COMPOSE_FILE")
          compose_project_name=$(printf '%q' "$COMPOSE_PROJECT_NAME")
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd \"$VPS_DEPLOY_PATH\" && BACKEND_IMAGE=$backend_image FRONTEND_IMAGE=$frontend_image PUBLIC_FRONTEND_URL=$public_frontend_url PUBLIC_BACKEND_URL=$public_backend_url COMPOSE_FILE=$compose_file COMPOSE_PROJECT_NAME=$compose_project_name bash ./.deploy-vps.sh"

      - name: Verify public deployment from runner
        shell: bash
        run: |
          set -euo pipefail

          retry_http() {
            local url="$1"

            for attempt in {1..30}; do
              if curl -fsS "$url" >/dev/null; then
                return 0
              fi

              if [[ "$attempt" -lt 30 ]]; then
                sleep 2
              fi
            done

            echo "HTTP check failed for $url" >&2
            return 1
          }

          retry_http "$PUBLIC_FRONTEND_URL"
          retry_http "$PUBLIC_BACKEND_URL/question/"
          curl -fsS -H "Origin: $PUBLIC_FRONTEND_URL" -D - "$PUBLIC_BACKEND_URL/question/" -o /dev/null | grep -i "access-control-allow-origin"
          echo "Public deployment verification passed"
