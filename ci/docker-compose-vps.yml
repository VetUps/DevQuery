services:
  db:
    image: mysql:8.0
    container_name: devquery_db
    env_file: ["${VPS_ENV_FILE:-env.vps.example}"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    container_name: devquery_backend
    env_file: ["${VPS_ENV_FILE:-env.vps.example}"]
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 3306
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    container_name: devquery_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - backend

volumes:
  mysql_data:

networks:
  backend:
    driver: bridge
